<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urbex Radar</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0f19; font-family: monospace; color: #00ff66; overflow: hidden; }
        #panel { text-align: center; padding: 15px; background: #111625; border-bottom: 2px solid #00ff66; box-shadow: 0 4px 20px rgba(0,255,102,0.2); }
        #counter { font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        #canvas-container { width: 100%; height: calc(100vh - 80px); position: relative; display: flex; justify-content: center; align-items: center; }
        canvas { background: #0d1220; max-width: 100%; max-height: 100%; box-shadow: inset 0 0 30px rgba(0,255,102,0.3); }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="panel">
        <div>🧭 URBEX RADAR v1.0</div>
        <div id="counter">📍 OBJECTS LOADED: <span id="count">0</span></div>
        <div class="hint">Тапни в любую зону радара, чтобы зафиксировать точку объекта</div>
    </div>

    <div id="canvas-container">
        <canvas id="radarCanvas"></canvas>
    </div>

    <script type="text/javascript">
        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmx3Z29saWl3cGd4ZnhxcWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjU5Nzc0MTksImV4cCI6MjA0MTU1MzQxOX0.0'; 

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        let points = [];

        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight - 100);
            canvas.width = size;
            canvas.height = size;
            drawRadar();
        }

        function drawRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = canvas.width / 2 - 10;

            // Сетка радара
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.15)';
            ctx.lineWidth = 1;
            for(let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, (r / 4) * i, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Перекрестие
            ctx.beginPath();
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.stroke();

            // Отрисовка зафиксированных точек
            points.forEach(p => {
                // Переводим сохраненные виртуальные координаты в пиксели экрана
                const px = cx + (p.lng * (r / 180));
                const py = cy - (p.lat * (r / 90));

                ctx.fillStyle = '#ff3333';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3333';
                ctx.beginPath();
                ctx.arc(px, py, 6, 0, Math.PI * 2);
                ctx.fill();

                // Текст над точкой
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#00ff66';
                ctx.font = '10px monospace';
                ctx.fillText(p.name, px + 10, py - 5);
            });
        }

        async function loadPoints() {
            try {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/points?select=*`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                if (Array.isArray(data)) {
                    points = data;
                    document.getElementById('count').innerText = points.length;
                    drawRadar();
                }
            } catch(e) {
                document.getElementById('count').innerText = "ERROR";
            }
        }

        canvas.addEventListener('click', async function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = canvas.width / 2 - 10;

            // Вычисляем виртуальные координаты относительно центра экрана
            const lng = (x - cx) / (r / 180);
            const lat = (cy - y) / (r / 90);

            const name = prompt("Введите кодовое название заброшки:");
            if (!name) return;
            const description = prompt("Краткое состояние/описание:") || "";

            // Добавляем локально
            points.push({ lat, lng, name, description });
            document.getElementById('count').innerText = points.length;
            drawRadar();

            // Шлем пакет в Supabase
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/points`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ lat, lng, name, description })
                });
            } catch (err) { console.error(err); }
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loadPoints();
        setInterval(loadPoints, 15000); // Автопроверка новых точек раз в 15 секунд
    </script>
</body>
</html>
